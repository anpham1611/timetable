schema: spec-driven

context: |
  This is a small full-stack web application in a pnpm monorepo.
  Product specifications should focus on observable behavior and requirements.
  Repository engineering conventions are defined in the root AGENTS.md.

rules:
  proposal:
    - Keep proposals focused on one coherent change.
    - Clearly state scope and out-of-scope items.
    - Prefer observable requirements over implementation details.

  specs:
    - Write requirements as observable and testable behavior.
    - Include important success, failure, and edge-case scenarios.

  tasks:
    - Break implementation into small, verifiable tasks.
    - Keep tasks ordered by dependency.

operations:
  apply:
    guidance:
      - Read the root AGENTS.md before implementing changes.
      - Follow the approved OpenSpec scope.
      - Do not silently expand the scope of a change.
      - Run relevant validation after implementation.

  archive:
    guidance:
      - Verify the implementation against the approved specification.
      - Summarize verification results.
